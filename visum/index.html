<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visa support for Germany · DEUS digital school</title>
<meta name="description" content="Visa support for Germany: Start, Standard and Premium packages, blocked account, interview preparation and a meeting at the airport.">
<link rel="canonical" href="https://deus-school.com/visum/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://deus-school.com/visum/">
<meta property="og:title" content="Visa support for Germany · DEUS digital school">
<meta property="og:description" content="Visa support for Germany: Start, Standard and Premium packages, blocked account, interview preparation and a meeting at the airport.">
<meta property="og:image" content="https://deus-school.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-page="visum" data-title="visum.title">
<main>
  <section class="page-hero">
    <div class="glow" aria-hidden="true"><i></i><i></i></div>
    <div class="wrap">
      
      <h1 data-i18n="visum.h1"></h1>
      <p class="lead" data-i18n="visum.lead"></p>
      <p class="pill" data-i18n="visum.intake"></p>
    </div>
  </section>

  <section class="sec">
    <div class="wrap">
      <h2 data-i18n="visum.packages"></h2>
      <p class="sec-lead" data-i18n="visum.packagesLead"></p>
      <div class="grid tiers" data-render="visaPackages"></div>
      <p class="note" data-i18n="visum.note"></p>
    </div>
  </section>

  <section class="sec alt" id="airport">
    <div class="wrap">
      <h2 data-i18n="airport.title"></h2>
      <p class="sec-lead" data-i18n="airport.lead"></p>
      <div class="grid two">
        <div class="card"><h3 data-i18n="airport.inc"></h3><ul class="checks">
          <li data-i18n="airport.a1"></li>
          <li data-i18n="airport.a2"></li>
          <li data-i18n="airport.a3"></li>
          <li data-i18n="airport.a4"></li>
          <li data-i18n="airport.a5"></li>
        </ul></div>
        <div class="card"><h3 data-i18n="airport.cond"></h3><ul class="dots-list">
          <li data-i18n="airport.c1"></li>
          <li data-i18n="airport.c2"></li>
        </ul></div>
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="wrap">
      <h2 data-i18n="extras.title"></h2>
      <p class="sec-lead" data-i18n="extras.lead"></p>
      <div class="table-wrap" data-render="visaExtras"></div>
    </div>
  </section>

  <section class="sec alt">
    <div class="wrap">
      <h2 data-i18n="work.title"></h2>
      <p class="sec-lead" data-i18n="work.lead"></p>
      <ol class="steps">
        <li><b>1</b><h3 data-i18n="work.1.t"></h3><p data-i18n="work.1.d"></p></li>
        <li><b>2</b><h3 data-i18n="work.2.t"></h3><p data-i18n="work.2.d"></p></li>
        <li><b>3</b><h3 data-i18n="work.3.t"></h3><p data-i18n="work.3.d"></p></li>
        <li><b>4</b><h3 data-i18n="work.4.t"></h3><p data-i18n="work.4.d"></p></li>
      </ol>
    </div>
  </section>

  <section class="sec">
    <div class="wrap grid two">
      <div class="card"><h3 data-i18n="sep.title"></h3><ul class="dots-list">
          <li data-i18n="sep.1"></li>
          <li data-i18n="sep.2"></li>
          <li data-i18n="sep.3"></li>
          <li data-i18n="sep.4"></li>
      </ul></div>
      <div class="card"><h3 data-i18n="terms.title"></h3><ul class="dots-list">
          <li data-i18n="terms.1"></li>
          <li data-i18n="terms.2"></li>
          <li data-i18n="terms.3"></li>
          <li data-i18n="terms.4"></li>
      </ul></div>
    </div>
  </section>

  <section class="final">
    <div class="wrap final-in">
      <div>
        <h2 data-i18n="visum.final.title"></h2>
        <p data-i18n="visum.final.text"></p>
      </div>
      <a class="btn primary big" data-link="teacher" target="_blank" rel="noopener" data-i18n="visa.cta"></a>
    </div>
  </section>
</main>
<script src="/assets/content.js"></script>
<script src="/assets/i18n/common.js"></script>
<script src="/assets/i18n/visum.js"></script>
<script src="/assets/app.js"></script>

</body>
</html>
