<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>International students · DEUS digital school</title>
<meta name="description" content="Learn German online with DEUS from any country: Zoom lessons, exams recognised in Germany, speaking clubs.">
<link rel="canonical" href="https://deus-school.com/international/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://deus-school.com/international/">
<meta property="og:title" content="International students · DEUS digital school">
<meta property="og:description" content="Learn German online with DEUS from any country: Zoom lessons, exams recognised in Germany, speaking clubs.">
<meta property="og:image" content="https://deus-school.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-page="international" data-title="intl.title">
<main>
  <section class="page-hero">
    <div class="glow" aria-hidden="true"><i></i><i></i></div>
    <div class="wrap">
      
      <h1 data-i18n="intl.h1"></h1>
      <p class="lead" data-i18n="intl.lead"></p>
      
    </div>
  </section>

  <section class="sec">
    <div class="wrap">
      <div class="grid services">
        <article class="card"><div class="ic">💻</div><h3 data-i18n="intl.f1.t"></h3><p data-i18n="intl.f1.d"></p></article>
        <article class="card"><div class="ic">🏅</div><h3 data-i18n="intl.f2.t"></h3><p data-i18n="intl.f2.d"></p></article>
        <article class="card"><div class="ic">🗣</div><h3 data-i18n="intl.f3.t"></h3><p data-i18n="intl.f3.d"></p></article>
      </div>
    </div>
  </section>

  <section class="sec alt">
    <div class="wrap">
      <div class="from"><b data-val="countries"></b><div><h2 data-i18n="intl.from"></h2><p class="sec-lead" data-i18n="intl.fromLead"></p></div></div>
      <ul class="chips" data-render="countries"></ul>
    </div>
  </section>

  <section class="sec">
    <div class="wrap">
      <h2 data-i18n="intl.results"></h2>
      <div class="grid results" data-render="intlResults" data-show-empty="intlSoon"></div>
      <p class="empty" id="intlSoon" data-i18n="intl.soon"></p>
    </div>
  </section>

  <section class="sec alt">
    <div class="wrap">
      <h2 data-i18n="home.courses.title"></h2>
      <p class="sec-lead" data-i18n="home.courses.lead"></p>
      <div class="grid tiers" data-render="courses"></div>
      <p class="note" data-i18n="course.rateNote"></p>
    </div>
  </section>

  <section class="final">
    <div class="wrap final-in">
      <div>
        <h2 data-i18n="final.title"></h2>
        <p data-i18n="final.text"></p>
      </div>
      <a class="btn primary big" data-link="bot" target="_blank" rel="noopener" data-i18n="cta.trial"></a>
    </div>
  </section>
</main>
<script src="/assets/content.js"></script>
<script src="/assets/i18n/common.js"></script>
<script src="/assets/i18n/home.js"></script>
<script src="/assets/i18n/pages.js"></script>
<script src="/assets/app.js"></script>

</body>
</html>
