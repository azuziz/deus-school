<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEUS digital school</title>
<meta name="description" content="Немецкий онлайн A1–C1, подготовка к Goethe, telc, ÖSD, TestDaF, документы для учёбы и визы в Германию, математика на немецком для Studienkolleg.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <a class="logo" href="#">
      <span class="flag"><i></i><i></i><i></i></span>
      <span>DEUS <small>digital school</small></span>
    </a>
    <nav class="nav">
      <a href="#services" data-i18n="nav.services"></a>
      <a href="#how" data-i18n="nav.how"></a>
      <a href="#results" data-i18n="nav.results" data-needs="results"></a>
      <a href="#reviews" data-i18n="nav.reviews" data-needs="reviews"></a>
      <a href="#telegram" data-i18n="nav.contact"></a>
    </nav>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="uz">UZ</button><button data-lang="ru">RU</button><button data-lang="en">EN</button>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap hero-in">
      <div>
        <p class="kicker" data-i18n="hero.kicker"></p>
        <h1 data-i18n="hero.title"></h1>
        <p class="lead" data-i18n="hero.lead"></p>
        <div class="btns">
          <a class="btn primary" data-link="bot" target="_blank" rel="noopener"><span data-i18n="cta.trial"></span> <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          <a class="btn ghost" href="#services" data-i18n="cta.services"></a>
        </div>
        <div class="exams">
          <span data-i18n="hero.exams"></span>
          <ul><li>Goethe</li><li>telc</li><li>ÖSD</li><li>TestDaF</li><li>DTZ</li></ul>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="levels">
          <span>A1</span><span>A2</span><span>B1</span><span class="on">B2</span><span>C1</span>
        </div>
        <div class="chat">
          <div class="chat-head"><span class="ava">S</span><div><b>Sophie</b><small>@attemptobot</small></div></div>
          <div class="chat-body">
            <p class="msg" data-i18n="chat.hello"></p>
            <div class="kb">
              <span data-i18n="chat.btn.book"></span>
              <span data-i18n="chat.btn.practice"></span>
              <span data-i18n="chat.btn.info"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="services" class="sec">
    <div class="wrap">
      <h2 data-i18n="services.title"></h2>
      <p class="sec-lead" data-i18n="services.lead"></p>
      <div class="grid services">
        <article class="card"><div class="ic">A–C</div><h3 data-i18n="s1.title"></h3><p data-i18n="s1.text"></p></article>
        <article class="card"><div class="ic"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg></div><h3 data-i18n="s2.title"></h3><p data-i18n="s2.text"></p></article>
        <article class="card"><div class="ic"><svg viewBox="0 0 24 24"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg></div><h3 data-i18n="s3.title"></h3><p data-i18n="s3.text"></p></article>
        <article class="card"><div class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M8 17h8"/></svg></div><h3 data-i18n="s4.title"></h3><p data-i18n="s4.text"></p></article>
        <article class="card"><div class="ic">∑</div><h3 data-i18n="s5.title"></h3><p data-i18n="s5.text"></p></article>
        <article class="card"><div class="ic"><svg viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h6M8 11h6"/></svg></div><h3 data-i18n="s6.title"></h3><p data-i18n="s6.text"></p></article>
      </div>
    </div>
  </section>

  <section id="how" class="sec alt">
    <div class="wrap">
      <h2 data-i18n="how.title"></h2>
      <ol class="steps">
        <li><b>1</b><h3 data-i18n="h1.title"></h3><p data-i18n="h1.text"></p></li>
        <li><b>2</b><h3 data-i18n="h2.title"></h3><p data-i18n="h2.text"></p></li>
        <li><b>3</b><h3 data-i18n="h3.title"></h3><p data-i18n="h3.text"></p></li>
        <li><b>4</b><h3 data-i18n="h4.title"></h3><p data-i18n="h4.text"></p></li>
      </ol>
    </div>
  </section>

  <section id="results" class="sec">
    <div class="wrap">
      <h2 data-i18n="results.title"></h2>
      <p class="sec-lead" data-i18n="results.lead"></p>
      <div class="grid results" id="resultsGrid"></div>
    </div>
  </section>

  <section id="reviews" class="sec alt">
    <div class="wrap">
      <h2 data-i18n="reviews.title"></h2>
      <div class="grid reviews" id="reviewsGrid"></div>
    </div>
  </section>

  <section id="telegram" class="sec">
    <div class="wrap">
      <h2 data-i18n="tg.title"></h2>
      <div class="grid tg">
        <div class="tg-card">
          <div class="tg-ic"><svg viewBox="0 0 24 24"><path d="M3 11l18-7-3 16-6-5-3 3v-5l9-7"/></svg></div>
          <h3 data-i18n="tg.channel.title"></h3>
          <p data-i18n="tg.channel.text"></p>
          <a class="btn primary" data-link="channel" target="_blank" rel="noopener" data-i18n="tg.channel.btn"></a>
        </div>
        <div class="tg-card bot">
          <div class="tg-ic">S</div>
          <h3 data-i18n="tg.bot.title"></h3>
          <p data-i18n="tg.bot.text"></p>
          <a class="btn light" data-link="bot" target="_blank" rel="noopener" data-i18n="tg.bot.btn"></a>
        </div>
      </div>
    </div>
  </section>

  <section class="final">
    <div class="wrap final-in">
      <div>
        <h2 data-i18n="final.title"></h2>
        <p data-i18n="final.text"></p>
      </div>
      <a class="btn primary big" data-link="bot" target="_blank" rel="noopener" data-i18n="cta.trial"></a>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <span>© <span id="year"></span> DEUS digital school</span>
    <a data-link="teacher" target="_blank" rel="noopener" data-i18n="footer.teacher"></a>
  </div>
</footer>

<script src="content.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
