<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEUS digital school — German online, A1 to C1</title>
<meta name="description" content="Online German school: A1–C1 courses, Goethe, telc, TestDaF exam preparation, Studienkolleg, study and visa documents for Germany. Free trial lesson.">
<link rel="canonical" href="https://deus-school.com/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://deus-school.com/">
<meta property="og:title" content="DEUS digital school — German online, A1 to C1">
<meta property="og:description" content="Online German school: A1–C1 courses, Goethe, telc, TestDaF exam preparation, Studienkolleg, study and visa documents for Germany. Free trial lesson.">
<meta property="og:image" content="https://deus-school.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-page="home">
<main>
  <section class="hero">
    <div class="glow" aria-hidden="true"><i></i><i></i></div>
    <div class="wrap hero-in">
      <div>
        <p class="kicker" data-i18n="hero.kicker"></p>
        <h1 data-i18n="hero.title"></h1>
        <p class="lead" data-i18n="hero.lead"></p>
        <div class="stats">
          <div><b data-val="teachingYears"></b><span data-i18n="stat.teach"></span></div>
          <div><b data-val="germanyYears"></b><span data-i18n="stat.de"></span></div>
          <div><b data-val="countries"></b><span data-i18n="stat.countries"></span></div>
        </div>
        <div class="btns">
          <a class="btn primary" data-link="bot" target="_blank" rel="noopener"><span data-i18n="cta.trial"></span> <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          <a class="btn ghost" href="/kurse/" data-i18n="cta.courses"></a>
        </div>
        <div class="exams">
          <span data-i18n="hero.exams"></span>
          <ul><li>Goethe</li><li>telc</li><li>ÖSD</li><li>TestDaF</li><li>DTZ</li></ul>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="levels"><span>A1</span><span>A2</span><span>B1</span><span class="on">B2</span><span>C1</span></div>
        <div class="chat">
          <div class="chat-head"><span class="ava">S</span><div><b>Sophie</b><small>@attemptobot</small></div></div>
          <div class="chat-body">
            <p class="dots" aria-hidden="true"><i></i><i></i><i></i></p>
            <p class="msg" data-i18n="chat.hello"></p>
            <div class="kb"><span data-i18n="chat.btn.book"></span><span data-i18n="chat.btn.practice"></span><span data-i18n="chat.btn.info"></span></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="wrap">
      <h2 data-i18n="path.title"></h2>
      <p class="sec-lead" data-i18n="path.lead"></p>
      <ol class="path">
        <li><a href="/kurse/"><b>1</b><div><h3 data-i18n="path.1.t"></h3><p data-i18n="path.1.d"></p></div></a></li>
        <li><a href="/sophie/"><b>2</b><div><h3 data-i18n="path.2.t"></h3><p data-i18n="path.2.d"></p></div></a></li>
        <li><a href="/speaking-club/"><b>3</b><div><h3 data-i18n="path.3.t"></h3><p data-i18n="path.3.d"></p></div></a></li>
        <li><a href="/results/"><b>4</b><div><h3 data-i18n="path.4.t"></h3><p data-i18n="path.4.d"></p></div></a></li>
        <li><a href="/visum/"><b>5</b><div><h3 data-i18n="path.5.t"></h3><p data-i18n="path.5.d"></p></div></a></li>
        <li><a href="/visum/#airport"><b>6</b><div><h3 data-i18n="path.6.t"></h3><p data-i18n="path.6.d"></p></div></a></li>
      </ol>
    </div>
  </section>

  <section class="sec alt">
    <div class="wrap">
      <h2 data-i18n="home.courses.title"></h2>
      <p class="sec-lead" data-i18n="home.courses.lead"></p>
      <div class="grid tiers" data-render="courses"></div>
      <p class="note" data-i18n="course.rateNote"></p>
    </div>
  </section>

  <section class="sec" id="resultsTeaser">
    <div class="wrap">
      <div class="sec-head"><div><h2 data-i18n="home.results.title"></h2><p class="sec-lead" data-i18n="home.results.lead"></p></div>
        <a class="link-more" href="/results/"><span data-i18n="cta.allResults"></span> <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>
      <div class="grid results" data-render="resultsTeaser" data-hide-empty="resultsTeaser"></div>
      <div class="grid reviews" data-render="reviews"></div>
    </div>
  </section>

  <section class="sec alt">
    <div class="wrap">
      <h2 data-i18n="tg.title"></h2>
      <div class="grid tg">
        <div class="tg-card">
          <div class="tg-ic"><svg viewBox="0 0 24 24"><path d="M3 11l18-7-3 16-6-5-3 3v-5l9-7"/></svg></div>
          <h3 data-i18n="tg.channel.title"></h3>
          <p data-i18n="tg.channel.text"></p>
          <a class="btn primary" data-link="channel" target="_blank" rel="noopener" data-i18n="tg.channel.btn"></a>
        </div>
        <div class="tg-card bot">
          <div class="tg-ic">S</div>
          <h3 data-i18n="tg.bot.title"></h3>
          <p data-i18n="tg.bot.text"></p>
          <a class="btn light" data-link="bot" target="_blank" rel="noopener" data-i18n="tg.bot.btn"></a>
        </div>
      </div>
    </div>
  </section>

  <section class="final">
    <div class="wrap final-in">
      <div>
        <h2 data-i18n="final.title"></h2>
        <p data-i18n="final.text"></p>
      </div>
      <a class="btn primary big" data-link="bot" target="_blank" rel="noopener" data-i18n="cta.trial"></a>
    </div>
  </section>
</main>
<script src="/assets/content.js"></script>
<script src="/assets/i18n/common.js"></script>
<script src="/assets/i18n/home.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
