<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaking club · DEUS digital school</title>
<meta name="description" content="Free online German speaking club in the DEUS Telegram channel, with guests who live in Germany.">
<link rel="canonical" href="https://deus-school.com/speaking-club/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://deus-school.com/speaking-club/">
<meta property="og:title" content="Speaking club · DEUS digital school">
<meta property="og:description" content="Free online German speaking club in the DEUS Telegram channel, with guests who live in Germany.">
<meta property="og:image" content="https://deus-school.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-page="club" data-title="club.title">
<main>
  <section class="page-hero">
    <div class="glow" aria-hidden="true"><i></i><i></i></div>
    <div class="wrap">
      <p class="kicker" data-i18n="club.kicker"></p>
      <h1 data-i18n="club.h1"></h1>
      <p class="lead" data-i18n="club.lead"></p>
      <div class="btns"><a class="btn primary" data-link="channel" target="_blank" rel="noopener" data-i18n="club.cta"></a></div>
    </div>
  </section>

  <section class="sec">
    <div class="wrap">
      <div class="grid services four">
        <article class="card"><div class="ic">🎟</div><h3 data-i18n="club.f1.t"></h3><p data-i18n="club.f1.d"></p></article>
        <article class="card"><div class="ic">🇩🇪</div><h3 data-i18n="club.f2.t"></h3><p data-i18n="club.f2.d"></p></article>
        <article class="card"><div class="ic">🌍</div><h3 data-i18n="club.f3.t"></h3><p data-i18n="club.f3.d"></p></article>
        <article class="card"><div class="ic">📅</div><h3 data-i18n="club.f4.t"></h3><p data-i18n="club.f4.d"></p></article>
      </div>
    </div>
  </section>

  <section class="sec alt">
    <div class="wrap">
      <h2 data-i18n="club.past"></h2>
      <ol class="sessions" data-render="clubSessions"></ol>
    </div>
  </section>

  <section class="final">
    <div class="wrap final-in">
      <div>
        <h2 data-i18n="final.title"></h2>
        <p data-i18n="final.text"></p>
      </div>
      <a class="btn primary big" data-link="bot" target="_blank" rel="noopener" data-i18n="cta.trial"></a>
    </div>
  </section>
</main>
<script src="/assets/content.js"></script>
<script src="/assets/i18n/common.js"></script>
<script src="/assets/i18n/pages.js"></script>
<script src="/assets/app.js"></script>

</body>
</html>
